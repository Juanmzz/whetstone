name: gate

# The other half of the pre-push hook. The hook runs deterministic checks only, so
# it stays fast enough not to be bypassed; CI is where the slower, costlier work
# belongs because nobody is waiting on it.
#
# NOTE ON THE REVIEW LENS: `claude` is not authenticated here, so the agent-lens
# check cannot run. That is deliberately NOT papered over. The gate reports it as
# `errored` (the gate being broken) rather than `fail` (the change being bad), and
# exits 2 only if a BLOCKING check could not run. adr-0027 promoted `correctness`
# to `block`, so an unauthenticated runner now makes CI exit 2 on any change the
# lens covers, which is `src/**/*.ts`. That is the honest reading of hard rule 3
# and it is also a bill: wiring an ANTHROPIC_API_KEY secret is what clears it.

on:
  # `edited` is here because the body check reads the body. Without it, a writer
  # told to fix the body edits it and nothing re-runs: a re-run replays the event
  # payload it was triggered with, which still carries the text that failed. The
  # other four types are the default set, which naming any type overrides.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Read-only is all the gate needs: it verifies a diff and sets an exit code, and
# writes nothing back. `pull-requests: write` was here for the annotation step,
# which ADR-0009 removed.
permissions:
  contents: read

jobs:
  gate:
    # An edit changes the body, never the diff, so the verdict on the diff still
    # stands. Re-running the suite to reach the same answer is what gets a gate
    # turned off.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the base, so a shallow clone has nothing to
          # compare with. Full history is the cheapest way to get that right.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: whetstone gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "gating $RANGE"
          node dist/cli.js gate --range "$RANGE" --no-lens --no-evidence

  # Its own job so an edit can re-run it alone. A push to `main` has no body to
  # read, and the script says so and exits 0 rather than inventing a verdict.
  pr-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:pr-body
