version: 0
agent: claude             # which adapter runs llm checks
backend: files            # files = self-contained, git-native, zero deps
memory:
  # Pins the namespace for any memory adapter (ADR-0001's memory port).
  # Without this it is inferred from the git remote — this repo has none, and the ambient
  # tooling has been observed defaulting Whetstone work into another project's namespace.
  namespace: whetstone
retro:
  suggest_after: 5        # signals
skills:                   # ACTIVE skills — the registry (SPEC §3.5)
  - skills/delegation.md
  - skills/tdd-discipline.md
  - skills/doc-locations.md
  - skills/token-economy.md
  - skills/recording.md
  - skills/voice.md
  - skills/lazy.md
  - skills/xreview.md
